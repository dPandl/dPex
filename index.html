<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dPex | Inoffizieller Monster Katalog</title>
    <link rel="icon" type="image/png" href="/dPex/favicon.png">
    <link rel="apple-touch-icon" href="/dPex/favicon.png">
    <link rel="manifest" href="/dPex/manifest.json" crossorigin="anonymous">
    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="dPex">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        };
        // Schnelle Initialisierung gegen Aufblitzen (FOUC)
        (function() {
            try {
                const storedTheme = localStorage.getItem('theme');
                if (storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#111827');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#f8fafc');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        /* Lokale Poppins Schriftarten */
        @font-face {
            font-display: swap;
            font-family: 'Poppins';
            font-style: normal;
            font-weight: 400;
            src: url('/dPex/fonts/Poppins-Regular.woff2') format('woff2');
        }
        @font-face {
            font-display: swap;
            font-family: 'Poppins';
            font-style: normal;
            font-weight: 500;
            src: url('/dPex/fonts/Poppins-Medium.woff2') format('woff2');
        }
        @font-face {
            font-display: swap;
            font-family: 'Poppins';
            font-style: normal;
            font-weight: 600;
            src: url('/dPex/fonts/Poppins-SemiBold.woff2') format('woff2');
        }
        @font-face {
            font-display: swap;
            font-family: 'Poppins';
            font-style: normal;
            font-weight: 700;
            src: url('/dPex/fonts/Poppins-Bold.woff2') format('woff2');
        }

        html {
            scrollbar-gutter: stable;
        }

        body {
            font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            transition: background-color 0.25s cubic-bezier(0.4, 0, 0.2, 1), color 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html.dark body {
            background-color: #111827;
            color: #f3f4f6;
        }

        .pokemon-card {
            content-visibility: auto;
            contain-intrinsic-size: auto 256px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transition: background-color 0.25s cubic-bezier(0.4, 0, 0.2, 1), 
                        border-color 0.25s cubic-bezier(0.4, 0, 0.2, 1), 
                        color 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.2s ease, 
                        box-shadow 0.2s ease;
        }

        .pokemon-card:hover {
            will-change: transform;
        }

        /* Physikalischer Feder-Bounce / Overshoot (normal -> super big -> normal -> big -> normal) */
        @keyframes logo-pop {
            0% {
                transform: scale(1);
                animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
            }
            32% {
                /* 1. Sprung: Super big (nach vorne) */
                transform: scale(1.38);
                animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4);
            }
            58% {
                /* Rückfall: Normal */
                transform: scale(1.0);
                animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
            }
            78% {
                /* 2. Sprung: Big (kleiner Nachfedereffekt) */
                transform: scale(1.15);
                animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4);
            }
            92% {
                /* Leichtes Abfangen */
                transform: scale(0.99);
                animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
            }
            100% {
                /* Zurück in Ruhezustand */
                transform: scale(1);
            }
        }

        .animate-logo-pop {
            animation: logo-pop 0.9s forwards;
            transform-origin: center center;
        }

        /* Pokémon Kampf-Animationen (Klassisches Vorpreschen & Zurückfedern) */
        @keyframes battle-attack-p1 {
            0% { transform: translate(var(--p1-x, 0%), var(--p1-offset, 0%)) scale(1); }
            35% { transform: translate(calc(var(--p1-x, 0%) + 42px), calc(var(--p1-offset, 0%) - 20px)) scale(1.08); }
            70% { transform: translate(calc(var(--p1-x, 0%) + 50px), calc(var(--p1-offset, 0%) - 25px)) scale(1.08); }
            100% { transform: translate(var(--p1-x, 0%), var(--p1-offset, 0%)) scale(1); }
        }

        @keyframes battle-attack-p2 {
            0% { transform: translate(var(--p2-x, 0%), var(--p2-offset, 0%)) scale(1); }
            35% { transform: translate(calc(var(--p2-x, 0%) - 42px), calc(var(--p2-offset, 0%) + 16px)) scale(1.08); }
            70% { transform: translate(calc(var(--p2-x, 0%) - 50px), calc(var(--p2-offset, 0%) + 20px)) scale(1.08); }
            100% { transform: translate(var(--p2-x, 0%), var(--p2-offset, 0%)) scale(1); }
        }

        @keyframes battle-hit-shake {
            0%, 100% { transform: translate(var(--target-x, 0%), var(--target-offset, 0%)); opacity: 1; }
            20% { transform: translate(calc(var(--target-x, 0%) - 12px), var(--target-offset, 0%)); opacity: 0.3; }
            40% { transform: translate(calc(var(--target-x, 0%) + 12px), var(--target-offset, 0%)); opacity: 0.8; }
            60% { transform: translate(calc(var(--target-x, 0%) - 8px), var(--target-offset, 0%)); opacity: 0.3; }
            80% { transform: translate(calc(var(--target-x, 0%) + 8px), var(--target-offset, 0%)); opacity: 0.9; }
        }

        .animate-battle-attack-p1 {
            animation: battle-attack-p1 0.45s ease-out forwards;
        }

        .animate-battle-attack-p2 {
            animation: battle-attack-p2 0.45s ease-out forwards;
        }

        .animate-battle-hit {
            animation: battle-hit-shake 0.4s ease-in-out forwards;
        }

        /* Status-Effekte: Buff (Härtner, Schwerttanz etc. - Leuchten & Pulsieren nach oben) */
        @keyframes battle-buff-glow {
            0% { transform: translate(var(--target-x, 0%), var(--target-offset, 0%)) scale(1); filter: brightness(1); }
            30% { transform: translate(var(--target-x, 0%), calc(var(--target-offset, 0%) - 14px)) scale(1.06); filter: brightness(1.7) drop-shadow(0 -8px 16px #3b82f6); }
            60% { transform: translate(var(--target-x, 0%), calc(var(--target-offset, 0%) - 6px)) scale(1.03); filter: brightness(1.9) drop-shadow(0 -12px 20px #60a5fa); }
            100% { transform: translate(var(--target-x, 0%), var(--target-offset, 0%)) scale(1); filter: brightness(1); }
        }

        /* Status-Effekte: Debuff (Heuler, Silberblick etc. - Zittern & Dunkelwerden) */
        @keyframes battle-debuff-shake {
            0% { transform: translate(var(--target-x, 0%), var(--target-offset, 0%)); filter: brightness(1); }
            25% { transform: translate(calc(var(--target-x, 0%) - 6px), calc(var(--target-offset, 0%) + 10px)); filter: brightness(0.6) drop-shadow(0 4px 8px #9333ea); }
            50% { transform: translate(calc(var(--target-x, 0%) + 6px), calc(var(--target-offset, 0%) + 10px)); filter: brightness(0.5); }
            75% { transform: translate(calc(var(--target-x, 0%) - 4px), calc(var(--target-offset, 0%) + 6px)); filter: brightness(0.7); }
            100% { transform: translate(var(--target-x, 0%), var(--target-offset, 0%)); filter: brightness(1); }
        }

        /* Spezielle Elementar-Projektil-Effekte */
        @keyframes battle-fire-flare {
            0% { transform: translate(var(--target-x, 0%), var(--target-offset, 0%)); filter: brightness(1); }
            35% { filter: brightness(2) drop-shadow(0 0 25px #f97316) drop-shadow(0 0 10px #ef4444); }
            70% { filter: brightness(1.8) drop-shadow(0 0 35px #eab308); }
            100% { transform: translate(var(--target-x, 0%), var(--target-offset, 0%)); filter: brightness(1); }
        }

        @keyframes battle-electric-flash {
            0%, 100% { transform: translate(var(--target-x, 0%), var(--target-offset, 0%)); filter: brightness(1); }
            20% { filter: brightness(2.5) drop-shadow(0 0 20px #facc15) invert(0.2); }
            40% { filter: brightness(0.7); }
            60% { filter: brightness(2.8) drop-shadow(0 0 30px #fde047); }
            80% { filter: brightness(1.2); }
        }

        @keyframes battle-water-wave {
            0% { transform: translate(var(--target-x, 0%), var(--target-offset, 0%)); }
            25% { transform: translate(calc(var(--target-x, 0%) - 10px), calc(var(--target-offset, 0%) + 8px)); filter: drop-shadow(0 0 18px #38bdf8); }
            50% { transform: translate(calc(var(--target-x, 0%) + 10px), calc(var(--target-offset, 0%) - 8px)); filter: drop-shadow(0 0 24px #0284c7); }
            75% { transform: translate(calc(var(--target-x, 0%) - 6px), var(--target-offset, 0%)); }
            100% { transform: translate(var(--target-x, 0%), var(--target-offset, 0%)); filter: none; }
        }

        .animate-battle-buff {
            animation: battle-buff-glow 0.65s ease-out forwards;
        }

        .animate-battle-debuff {
            animation: battle-debuff-shake 0.65s ease-in-out forwards;
        }

        .animate-battle-fire {
            animation: battle-fire-flare 0.5s ease-out forwards;
        }

        .animate-battle-electric {
            animation: battle-electric-flash 0.5s ease-in-out forwards;
        }

        .animate-battle-water {
            animation: battle-water-wave 0.55s ease-in-out forwards;
        }

        /* Pokémon Ein- und Auswechsel-Animationen (Ball-Rückruf / Hineinwerfen) */
        @keyframes battle-switch-shrink {
            0% { transform: translate(var(--sw-x, 0%), var(--sw-y, 0%)) scale(1); opacity: 1; filter: brightness(1); }
            50% { filter: brightness(2) drop-shadow(0 0 10px #ef4444); }
            100% { transform: translate(var(--sw-x, 0%), var(--sw-y, 0%)) scale(0); opacity: 0; filter: brightness(3); }
        }

        @keyframes battle-switch-grow {
            0% { transform: translate(var(--sw-x, 0%), var(--sw-y, 0%)) scale(0); opacity: 0; filter: brightness(3); }
            50% { filter: brightness(2) drop-shadow(0 0 10px #60a5fa); }
            100% { transform: translate(var(--sw-x, 0%), var(--sw-y, 0%)) scale(1); opacity: 1; filter: brightness(1); }
        }

        .animate-switch-shrink {
            animation: battle-switch-shrink 0.5s ease-in forwards;
        }

        .animate-switch-grow {
            animation: battle-switch-grow 0.55s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }

        /* Explizite Regeln für Mobiltelefone im Querformat / flache Bildschirme */
        @media (max-height: 520px) and (orientation: landscape) {
            .mobile-landscape-stage {
                padding: 4px 10px !important;
            }
            .mobile-landscape-status {
                transform: scale(0.72) skewX(-6deg) !important;
                transform-origin: top left !important;
                margin-bottom: -15px !important;
            }
            .mobile-landscape-status-p2 {
                transform: scale(0.72) skewX(-6deg) !important;
                transform-origin: bottom right !important;
                margin-top: -15px !important;
            }
            .mobile-landscape-sprite-p2 {
                width: 105px !important;
                height: 105px !important;
            }
            .mobile-landscape-sprite-p1 {
                width: 115px !important;
                height: 115px !important;
            }
            .mobile-landscape-shadow-p2 {
                width: 70px !important;
                height: 11px !important;
            }
            .mobile-landscape-shadow-p1 {
                width: 85px !important;
                height: 13px !important;
            }
            .mobile-landscape-control-wrapper {
                padding: 4px 8px !important;
                max-height: 86px !important;
            }
            .mobile-landscape-control {
                height: 72px !important;
            }
        }

        /* Diese Klasse versteckt Elemente auf dem Bildschirm */
        .no-print {
            display: block;
        }
        
        /* Moderne, dezente Scrollleiste */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(250, 204, 21, 0.7);
        }
        /* Firefox Support */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(156, 163, 175, 0.4) transparent;
        }

        /* Hilfsklasse für den 3D-Flipping-Effekt */
        .preserve-3d {
            transform-style: preserve-3d;
        }

        /* Dieser Bereich ist nur für den Druck gedacht */
        @media print {
            body {
                background-color: #ffffff !important;
                color: #111827 !important;
                padding: 0 !important;
                margin: 0 !important;
                counter-reset: page;
            }
            .no-print {
                display: none !important;
            }

            @page {
                size: A4 portrait;
                margin: 8mm 6mm 10mm 6mm;
                @bottom-right {
                    font-size: 0.8rem;
                    color: #4a5568;
                    content: "Seite " counter(page);
                    padding-bottom: 2mm;
                }
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .pokedex-grid {
                grid-template-columns: repeat(4, 1fr) !important;
                gap: 3.5mm !important;
                padding: 2mm !important;
                margin: 0 auto !important;
                display: grid !important;
                width: 100% !important;
                box-sizing: border-box !important;
            }

            .pokemon-card {
                height: 58.5mm !important;
                max-height: 58.5mm !important;
                padding: 2mm !important;
                border: 1px solid #e2e8f0 !important;
                border-radius: 4mm !important; /* Elegant abgerundet wie auf der Webseite */
                box-shadow: 0 1.5mm 3.5mm rgba(0, 0, 0, 0.08), 0 0.5mm 1mm rgba(0, 0, 0, 0.04) !important; /* Sanfter, edler Schatten */
                break-inside: avoid !important;
                page-break-inside: avoid !important;
                background-color: #ffffff !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
                box-sizing: border-box !important;
            }

            .pokemon-card img {
                width: 36mm !important;
                height: 36mm !important;
                max-width: 36mm !important;
                max-height: 36mm !important;
                object-fit: contain !important;
                margin-bottom: 1mm !important;
            }

            .pokemon-card p {
                font-size: 8pt !important;
                margin: 0 !important;
                line-height: 1.1 !important;
                color: #4b5563 !important;
            }

            .pokemon-card h2 {
                font-size: 10pt !important;
                margin: 0.5mm 0 0 0 !important;
                line-height: 1.1 !important;
                font-weight: bold !important;
                color: #111827 !important;
            }

            #print-footer-left {
                position: fixed;
                bottom: 2mm;
                left: 8mm;
                font-size: 0.8rem;
                color: #4a5568;
                display: block !important;
            }

            #print-footer-right {
                position: fixed;
                bottom: 2mm;
                right: 8mm;
                display: flex !important;
                align-items: center;
            }

            #print-footer-right img {
                height: 10mm;
                width: auto;
                object-fit: contain;
            }
        }
    </style>
