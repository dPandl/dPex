    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
            color: #f3f4f6;
        }

        /* Diese Klasse versteckt Elemente auf dem Bildschirm */
        .no-print {
            display: block;
        }
        
        /* Moderne, dezente Scrollleiste */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(250, 204, 21, 0.7);
        }
        /* Firefox Support */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(156, 163, 175, 0.4) transparent;
        }

        /* Hilfsklasse für den 3D-Flipping-Effekt */
        .preserve-3d {
            transform-style: preserve-3d;
        }

        /* Dieser Bereich ist nur für den Druck gedacht */
        @media print {
            body {
                background-color: #ffffff;
                color: #111827;
                padding: 0;
                margin: 0;
                counter-reset: page;
            }
            .no-print {
                display: none !important;
            }

            .pokedex-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
                gap: 1rem !important;
                padding: 1rem;
                display: grid; /* Sicherstellen, dass die Karten als Grid behandelt werden */
                align-content: center; /* Vertikale Zentrierung */
            }

            .pokemon-card {
                border: 1px solid #d1d5db;
                box-shadow: none;
                break-inside: avoid;
                margin-bottom: 2mm;
            }

            /* Seitenzahl und Generation in der Fußzeile */
            @page {
                @bottom-right {
                    font-size: 0.875rem;
                    color: #4a5568;
                    content: "Seite " counter(page);
                    padding-bottom: 2mm;
                }
            }

            #print-footer-left {
                position: fixed;
                bottom: 2mm;
                left: 1rem;
                font-size: 0.875rem;
                color: #4a5568;
                display: block !important;
            }

            #print-footer-right {
                position: fixed;
                bottom: 2mm;
                right: 1rem;
                display: flex !important;
                align-items: center;
            }

            #print-footer-right img {
                height: 14mm;
                width: auto;
                object-fit: contain;
            }
        }
    </style>
